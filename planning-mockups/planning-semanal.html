<title>Planning semanal · Mockups</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Instrument+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: barra fija con selector de propuesta; cada propuesta tiene sus propias pestañas Semana / Campañas.
   A = briefing editorial (claro/oscuro) · B = tablero operativo (claro/oscuro) · C = mission control (oscuro fijo) */
:root{
  --shell-bg:#eef0f3; --shell-fg:#1b1f27; --shell-muted:#5d6573; --shell-line:#d5d9e0; --shell-chip:#ffffff;
  /* A */
  --a-bg:#f7f8fa; --a-paper:#ffffff; --a-ink:#141a26; --a-muted:#5a6272; --a-line:#e1e4ea; --a-accent:#1f4fbf; --a-accent-soft:#e7eefc;
  /* B */
  --b-bg:#eef1ee; --b-card:#ffffff; --b-ink:#16201b; --b-muted:#5b6862; --b-line:#d8dfda; --b-accent:#0f7a55; --b-accent-soft:#e2f2ea;
  /* semánticos */
  --ok:#17803d; --ok-soft:#e3f4e8; --warn:#a86400; --warn-soft:#fbf0dc; --bad:#c22f2f; --bad-soft:#fbe5e5; --done:#4b5563; --done-soft:#eceef1;
  --f-ed:"Newsreader", Georgia, serif; --f-a:"Instrument Sans", system-ui, sans-serif;
  --f-b:"Manrope", system-ui, sans-serif; --f-mono:"JetBrains Mono", ui-monospace, monospace;
  --f-c:"Chakra Petch", "IBM Plex Sans", sans-serif; --f-cb:"IBM Plex Sans", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --shell-bg:#12151b; --shell-fg:#e8ebf0; --shell-muted:#9aa3b2; --shell-line:#2a303b; --shell-chip:#1b2029;
  --a-bg:#0f131a; --a-paper:#161b24; --a-ink:#e9edf4; --a-muted:#9ba4b4; --a-line:#29303c; --a-accent:#7ea6ff; --a-accent-soft:#1c2a47;
  --b-bg:#101512; --b-card:#18201b; --b-ink:#e6eee9; --b-muted:#97a59d; --b-line:#28332c; --b-accent:#4cc795; --b-accent-soft:#16302a;
  --ok:#4fc47a; --ok-soft:#163222; --warn:#f0b24a; --warn-soft:#3a2c12; --bad:#ff7a7a; --bad-soft:#3d1a1c; --done:#a3abb8; --done-soft:#232933;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --shell-bg:#12151b; --shell-fg:#e8ebf0; --shell-muted:#9aa3b2; --shell-line:#2a303b; --shell-chip:#1b2029;
  --a-bg:#0f131a; --a-paper:#161b24; --a-ink:#e9edf4; --a-muted:#9ba4b4; --a-line:#29303c; --a-accent:#7ea6ff; --a-accent-soft:#1c2a47;
  --b-bg:#101512; --b-card:#18201b; --b-ink:#e6eee9; --b-muted:#97a59d; --b-line:#28332c; --b-accent:#4cc795; --b-accent-soft:#16302a;
  --ok:#4fc47a; --ok-soft:#163222; --warn:#f0b24a; --warn-soft:#3a2c12; --bad:#ff7a7a; --bad-soft:#3d1a1c; --done:#a3abb8; --done-soft:#232933;
  color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--shell-bg);color:var(--shell-fg);font-family:var(--f-a);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--shell-bg)}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid #3b82f6;outline-offset:2px}

/* ---------- shell ---------- */
.shell{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--shell-bg);border-bottom:1px solid var(--shell-line)}
.shell-in{max-width:1180px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.shell-title{font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--shell-muted);margin-right:auto}
.switch{display:flex;gap:6px;flex-wrap:wrap}
.switch button{border:1px solid var(--shell-line);background:var(--shell-chip);color:var(--shell-fg);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600}
.switch button[aria-pressed="true"]{background:var(--shell-fg);color:var(--shell-bg);border-color:var(--shell-fg)}
.note{max-width:1180px;margin:0 auto;padding-block:8px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:12.5px;color:var(--shell-muted)}

.wrap{max-width:1180px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.prop{border-radius:18px;overflow:hidden}
.tabs{display:flex;gap:4px}
.tabs button{border:0;background:transparent}
.illus{font-size:11px;letter-spacing:.04em;text-transform:uppercase;opacity:.75}
svg text{font-family:var(--f-mono)}
.chart svg{width:100%;height:auto;display:block}
.chart{min-width:0}

/* ======================= A · BRIEFING ======================= */
.pA{background:var(--a-bg);color:var(--a-ink);font-family:var(--f-a);border:1px solid var(--a-line)}
.pA .a-head{background:var(--a-paper);border-bottom:1px solid var(--a-line);padding:28px 32px 0}
.pA .a-kicker{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--a-muted);font-weight:600}
.pA h1{font-family:var(--f-ed);font-weight:600;font-size:clamp(28px,4vw,40px);line-height:1.1;margin:6px 0 4px;text-wrap:balance}
.pA .a-sub{color:var(--a-muted);margin:0 0 18px;max-width:64ch}
.pA .tabs{margin-top:8px}
.pA .tabs button{padding:10px 16px;font-weight:600;color:var(--a-muted);border-bottom:2px solid transparent}
.pA .tabs button[aria-selected="true"]{color:var(--a-ink);border-bottom-color:var(--a-accent)}
.pA .a-body{padding:28px 32px 36px;display:grid;gap:32px}
.pA h2{font-family:var(--f-ed);font-weight:600;font-size:24px;margin:0 0 12px;text-wrap:balance}
.pA h2 small{font-family:var(--f-a);font-size:13px;color:var(--a-muted);font-weight:500;margin-left:8px}
.pA .focus{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.pA .focus-card{background:var(--a-paper);border:1px solid var(--a-line);border-radius:12px;padding:16px 18px;display:grid;gap:6px;align-content:start}
.pA .focus-card .lbl{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.pA .focus-card h3{margin:0;font-size:17px;line-height:1.3}
.pA .focus-card p{margin:0;color:var(--a-muted);font-size:14px}
.pA .grp{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--a-muted);font-weight:700;margin:16px 0 6px}
.pA .rows{background:var(--a-paper);border:1px solid var(--a-line);border-radius:12px;overflow:hidden}
.pA .row{display:grid;grid-template-columns:44px 170px 130px minmax(0,1fr) minmax(0,1fr);gap:14px;padding:12px 16px;border-top:1px solid var(--a-line);align-items:baseline}
.pA .row:first-child{border-top:0}
.pA .row .id{font-family:var(--f-mono);font-size:13px;color:var(--a-muted)}
.pA .row .t{font-weight:600}
.pA .row .ev{color:var(--a-muted);font-size:14px}
.pA .row .nx{font-size:14px}
.pA .row .nx::before{content:"→ ";color:var(--a-accent);font-weight:700}
.pA .goal-time{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px;color:var(--a-muted);font-size:14px}
.pA .bar{flex:1 1 220px;height:8px;background:var(--a-line);border-radius:99px;overflow:hidden;min-width:160px}
.pA .bar i{display:block;height:100%;background:var(--a-accent)}
.pA .plan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.pA .plan-col{background:var(--a-paper);border:1px solid var(--a-line);border-radius:12px;padding:14px 16px}
.pA .plan-col h3{margin:0 0 8px;font-size:14px;letter-spacing:.05em;text-transform:uppercase;display:flex;gap:8px;align-items:center}
.pA .plan-col ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.pA .plan-col li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;font-size:14px}
.pA .plan-col li input{margin-top:3px;accent-color:var(--a-accent)}
.pA .tags{display:inline-flex;gap:4px;margin-left:4px}
.pA .tag{font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:4px;background:var(--a-accent-soft);color:var(--a-accent);white-space:nowrap}
.pA .three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.pA .box{background:var(--a-paper);border:1px solid var(--a-line);border-radius:12px;padding:14px 16px}
.pA .box h3{margin:0 0 8px;font-size:15px}
.pA .box ul{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14px}
.pA .agenda{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.pA .day{background:var(--a-paper);border:1px solid var(--a-line);border-radius:12px;padding:12px}
.pA .day b{display:block;font-size:13px;margin-bottom:6px}
.pA .day div{font-size:13px;color:var(--a-muted);display:grid;gap:4px}
.pA .day .hl{color:var(--a-ink);font-weight:600}
/* campañas A */
.pA .camp{background:var(--a-paper);border:1px solid var(--a-line);border-radius:14px;padding:20px 22px;display:grid;gap:16px}
.pA .camp-h{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.pA .camp-h h3{font-family:var(--f-ed);font-size:24px;margin:0;font-weight:600}
.pA .camp-h .meta{color:var(--a-muted);font-size:14px;flex-basis:100%}
.pA .wk{display:inline-flex;gap:4px;align-items:center;font-size:12px;color:var(--a-muted);margin-left:auto}
.pA .wk i{width:22px;height:6px;border-radius:3px;background:var(--a-line)}
.pA .wk i.on{background:var(--a-accent)}
.pA .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.pA .kpi{border:1px solid var(--a-line);border-radius:10px;padding:10px 12px}
.pA .kpi .k{font-size:12px;color:var(--a-muted)}
.pA .kpi .v{font-family:var(--f-mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.pA .kpi .tg{font-size:12px;color:var(--a-muted)}
.pA .charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.pA .chart{border:1px solid var(--a-line);border-radius:10px;padding:10px 12px}
.pA .chart h4{margin:0 0 4px;font-size:13px;display:flex;justify-content:space-between;gap:8px}
.pA .read{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--a-accent-soft);border-radius:10px;padding:12px 14px;font-size:14px}
.pA .btn{display:inline-block;background:var(--a-accent);color:var(--a-paper);text-decoration:none;font-weight:600;font-size:13px;padding:8px 12px;border-radius:8px;white-space:nowrap}
.pA .btn.ghost{background:transparent;color:var(--a-accent);border:1px solid var(--a-accent)}
.pA{--c1:var(--a-accent);--c2:#d0791b;--grid:var(--a-line);--axis:var(--a-muted);--band:var(--a-accent-soft)}

/* pills compartidas */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;width:max-content}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.g{color:var(--ok);background:var(--ok-soft)}
.pill.y{color:var(--warn);background:var(--warn-soft)}
.pill.r{color:var(--bad);background:var(--bad-soft)}
.pill.d{color:var(--done);background:var(--done-soft)}
.pill.n{color:var(--done);background:transparent;border:1px dashed currentColor}

/* ======================= B · TABLERO ======================= */
.pB{background:var(--b-bg);color:var(--b-ink);font-family:var(--f-b);border:1px solid var(--b-line)}
.pB .b-top{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:18px 22px;border-bottom:1px solid var(--b-line);background:var(--b-card)}
.pB .b-top h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.pB .b-top .wkno{font-family:var(--f-mono);font-size:12px;background:var(--b-accent);color:var(--b-card);padding:3px 8px;border-radius:6px}
.pB .tabs{margin-left:auto;background:var(--b-bg);padding:4px;border-radius:10px;border:1px solid var(--b-line)}
.pB .tabs button{padding:6px 14px;border-radius:7px;font-weight:700;font-size:13px;color:var(--b-muted)}
.pB .tabs button[aria-selected="true"]{background:var(--b-card);color:var(--b-ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.pB .b-body{padding:20px 22px 30px;display:grid;gap:22px}
.pB h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 10px;color:var(--b-muted);font-weight:800;display:flex;gap:10px;align-items:center}
.pB h2 .cnt{font-family:var(--f-mono);color:var(--b-ink);letter-spacing:0}
.pB .strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.pB .sday{background:var(--b-card);border:1px solid var(--b-line);border-radius:10px;padding:10px;display:grid;gap:6px;align-content:start}
.pB .sday.today{border-color:var(--b-accent);box-shadow:inset 0 3px 0 var(--b-accent)}
.pB .sday .dn{font-size:12px;font-weight:800;color:var(--b-muted);display:flex;justify-content:space-between}
.pB .ev{font-size:12.5px;padding:4px 6px;border-radius:6px;background:var(--b-bg)}
.pB .ev.key{background:var(--b-accent-soft);color:var(--b-ink);font-weight:700}
.pB .ev time{font-family:var(--f-mono);font-size:11px;color:var(--b-muted);margin-right:4px}
.pB .alert{display:flex;gap:12px;align-items:center;background:var(--bad-soft);color:var(--b-ink);border-radius:10px;padding:10px 14px;font-size:14px;flex-wrap:wrap}
.pB .alert b{color:var(--bad)}
.pB .tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pB .tile{background:var(--b-card);border:1px solid var(--b-line);border-radius:10px;padding:10px 12px;display:grid;gap:4px;position:relative;align-content:start}
.pB .tile .hd{display:flex;justify-content:space-between;align-items:center;gap:6px}
.pB .tile .id{font-family:var(--f-mono);font-size:12px;color:var(--b-muted)}
.pB .tile .t{font-weight:700;font-size:14px}
.pB .tile .nx{font-size:12.5px;color:var(--b-muted)}
.pB .tile.r{border-color:var(--bad)}
.pB .tile .area{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--b-muted);font-weight:700}
.pB .goals{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px}
.pB .gcell{background:var(--b-card);border:1px solid var(--b-line);border-radius:8px;padding:8px;display:grid;gap:4px;text-align:center;justify-items:center}
.pB .gcell .id{font-family:var(--f-mono);font-weight:700;font-size:13px}
.pB .gcell .t{font-size:11.5px;color:var(--b-muted);line-height:1.25}
.pB .dot{width:12px;height:12px;border-radius:50%}
.pB .dot.g{background:var(--ok)}.pB .dot.y{background:var(--warn)}.pB .dot.r{background:var(--bad)}.pB .dot.d{background:var(--done)}.pB .dot.n{background:transparent;border:2px dashed var(--done)}
.pB .kanban{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pB .col{background:color-mix(in srgb,var(--b-line) 40%,transparent);border-radius:12px;padding:10px;display:grid;gap:8px;align-content:start}
.pB .col h3{margin:2px 4px 4px;font-size:13px;font-weight:800;display:flex;gap:8px;align-items:center}
.pB .card{background:var(--b-card);border:1px solid var(--b-line);border-radius:9px;padding:10px 12px;font-size:13.5px;display:grid;gap:6px}
.pB .card .tt{font-weight:700}
.pB .chips{display:flex;gap:4px;flex-wrap:wrap}
.pB .chip{font-family:var(--f-mono);font-size:10.5px;padding:1px 6px;border-radius:4px;border:1px solid var(--b-line);color:var(--b-muted)}
.pB .people{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.pB .person{background:var(--b-card);border:1px solid var(--b-line);border-radius:10px;padding:10px;font-size:13px;display:grid;gap:6px;align-content:start}
.pB .av{width:28px;height:28px;border-radius:50%;background:var(--b-accent-soft);color:var(--b-accent);display:grid;place-items:center;font-weight:800;font-size:12px}
.pB .person .pn{display:flex;gap:8px;align-items:center;font-weight:700}
.pB .watch{display:flex;gap:8px;flex-wrap:wrap}
.pB .watch span{background:var(--warn-soft);color:var(--b-ink);font-size:13px;padding:5px 10px;border-radius:8px}
/* campañas B */
.pB .tblwrap{overflow-x:auto;background:var(--b-card);border:1px solid var(--b-line);border-radius:12px}
.pB table{border-collapse:collapse;width:100%;min-width:760px;font-size:13.5px}
.pB th,.pB td{padding:10px 12px;text-align:left;border-top:1px solid var(--b-line);vertical-align:top}
.pB thead th{border-top:0;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--b-muted)}
.pB td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pB .cellv{display:inline-block;padding:2px 8px;border-radius:6px;font-family:var(--f-mono);font-size:12.5px}
.pB .cellv.g{background:var(--ok-soft);color:var(--ok)}.pB .cellv.y{background:var(--warn-soft);color:var(--warn)}.pB .cellv.r{background:var(--bad-soft);color:var(--bad)}.pB .cellv.n{background:var(--b-bg);color:var(--b-muted)}
.pB .gname{font-weight:800}
.pB .gname small{display:block;font-weight:500;color:var(--b-muted);font-size:12px}
.pB .mult{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pB .mcard{background:var(--b-card);border:1px solid var(--b-line);border-radius:12px;padding:12px;display:grid;gap:8px;align-content:start}
.pB .mcard h3{margin:0;font-size:14px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.pB .mcard p{margin:0;font-size:13px;color:var(--b-muted)}
.pB .mcard a{font-size:12.5px;font-weight:700;color:var(--b-accent);text-decoration:none}
.pB .empty{border:1px dashed var(--b-line);border-radius:10px;padding:18px;text-align:center;font-size:13px;color:var(--b-muted);display:grid;gap:6px}
.pB{--c1:var(--b-accent);--c2:#c56a1a;--grid:var(--b-line);--axis:var(--b-muted);--band:var(--b-accent-soft)}

/* ======================= C · MISSION CONTROL (oscuro fijo) ======================= */
.pC{--c-bg:#070b14;--c-panel:#0c1322;--c-panel2:#101a2e;--c-line:#1d2b46;--c-ink:#e6f1ff;--c-muted:#8aa0bf;--c-cyan:#5ee6f0;--c-amber:#ffc65c;--c-red:#ff6b81;--c-green:#5cf2a6;--c-dim:#3a4d6e;
  background:var(--c-bg);color:var(--c-ink);font-family:var(--f-cb);border:1px solid var(--c-line);color-scheme:dark;
  background-image:linear-gradient(var(--c-line) 1px,transparent 1px),linear-gradient(90deg,var(--c-line) 1px,transparent 1px);background-size:48px 48px;background-position:-1px -1px;
  --c1:var(--c-cyan);--c2:var(--c-amber);--grid:#1a2740;--axis:var(--c-muted);--band:rgba(94,230,240,.10)}
.pC .c-veil{background:linear-gradient(180deg,rgba(7,11,20,.92),rgba(7,11,20,.97))}
.pC .c-top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:center;padding:18px 22px;border-bottom:1px solid var(--c-line)}
.pC .c-logo{font-family:var(--f-c);font-weight:700;letter-spacing:.14em;font-size:13px;color:var(--c-cyan);text-transform:uppercase}

/* ============ CHARTS (SVG a escala) ============ */
function chart(c){
  const W=520,H=210,L=40,R=14,T=14,B=28, iw=W-L-R, ih=H-T-B;
  const yMin=c.yMin||0, yMax=c.yMax;
  const n=c.x.length;
  const xs = c.kind==='bars' ? (i=>L+iw*(i+.5)/n) : (i=>L+(n===1?iw/2:iw*i/(n-1)));
  const ys = v=>T+ih*(1-(v-yMin)/(yMax-yMin));
  let g='';
  const ticks=4;
  for(let k=0;k<=ticks;k++){const v=yMin+(yMax-yMin)*k/ticks;const y=ys(v);
    g+=`<line class="gridl" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text class="axt" x="${L-6}" y="${y+4}" text-anchor="end">${c.fmt(Math.round(v))}</text>`;}
  c.x.forEach((l,i)=>{g+=`<text class="axt" x="${xs(i)}" y="${H-8}" text-anchor="middle">${l}</text>`});
  if(c.band){const y1=ys(c.band.hi),y2=ys(c.band.lo);
    g+=`<rect class="bandr" x="${L}" y="${y1}" width="${iw}" height="${y2-y1}"/><text class="axt" x="${W-R-4}" y="${y1+13}" text-anchor="end">${c.band.label}</text>`;}
  if(c.target && c.target.line){const y=ys(c.target.y);
    g+=`<line class="ref" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text class="axt" x="${W-R-4}" y="${y-5}" text-anchor="end">${c.target.label}</text>`;}
  if(c.kind==='bars'){
    const bw=iw/n*0.32;
    c.s.forEach((ser,si)=>ser.forEach((v,i)=>{const x=xs(i)+(si===0?-bw-1:1);const y=ys(v);
      g+=`<rect class="f${si+1}" x="${x}" y="${y}" width="${bw}" height="${T+ih-y}" rx="2"/>`;}));
  } else {
    c.s.forEach((ser,si)=>{
      const pts=ser.map((v,i)=>v==null?null:[xs(i),ys(v)]).filter(Boolean);
      if(!pts.length)return;
      const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
      if(si===0) g+=`<path class="a1" d="${d} L${pts[pts.length-1][0]} ${T+ih} L${pts[0][0]} ${T+ih} Z"/>`;
      g+=`<path class="s${si+1}" d="${d}"/>`;
      // pendiente: línea punteada hasta el final
      const last=pts[pts.length-1]; const lastI=ser.map(v=>v!=null).lastIndexOf(true);
      if(lastI<n-1){g+=`<line class="pend" x1="${last[0]}" y1="${last[1]}" x2="${xs(n-1)}" y2="${last[1]}"/><text class="axt" x="${(last[0]+xs(n-1))/2}" y="${last[1]+16}" text-anchor="middle">pendiente</text>`;}
      g+=`<circle class="f${si+1}" cx="${last[0]}" cy="${last[1]}" r="4"/><text class="axt" x="${last[0]}" y="${last[1]+16}" text-anchor="middle">${c.fmt(ser[lastI])}</text>`;
    });
    if(c.target && !c.target.line){const x=xs(c.target.x),y=ys(c.target.y);
      g+=`<circle class="hollow" cx="${x}" cy="${y}" r="5"/><text class="axt" x="${x-8}" y="${y-9}" text-anchor="end">${c.target.label}</text>`;}
    if(c.mark!=null){const x=xs(c.mark);g+=`<line class="ref" x1="${x}" x2="${x}" y1="${T}" y2="${T+ih}"/><text class="axt" x="${x+5}" y="${T+11}">${c.markLabel}</text>`;}
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${c.title}">${g}</svg>`+
    (c.names?`<div class="legend">${c.names.map((nm,i)=>`<span><i style="background:var(--c${i+1})"></i>${nm}</span>`).join('')}</div>`:'');
}
